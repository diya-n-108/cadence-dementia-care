<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cadence</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
<style>
/* Theme tokens and accessibility settings */
:root{--bg:#F7F4EE;--paper:#FFFFFF;--ink:#2C2522;--mut:#6B5B53;--line:#E3D6CD;--g:#8C4A32;--g2:#F5EBE6;--b:#E6EEF2;--l:#F2E6EC;--sand:#F4EFEA;--fs:1.1rem}
body.s1{--fs:1.35rem}
body.s2{--fs:1.6rem}
body.th-terracotta{--bg:#FAF4EE;--g:#A95C39;--g2:#F7ECE6;--b:#E3E8EE;--l:#F0E6EF;--sand:#EFE5DC;--line:#E2D6CC}
body.th-forest{--bg:#F2F5F3;--g:#3B5343;--g2:#E5EDE8;--b:#E2ECEB;--l:#EFE5EC;--sand:#EBEFEA;--line:#D1DC5D}
body.th-clay{--bg:#F6F2EE;--g:#7D4E3D;--g2:#F4EBE6;--b:#E5ECEE;--l:#F0E5EC;--sand:#EFE8E2;--line:#DCCFC6}
body.th-hc{--bg:#FFFFFF;--paper:#FFFFFF;--ink:#000;--mut:#1A1A1A;--line:#000;--g:#0A3D26;--g2:#E4EFE8;--b:#E4EEF8;--l:#EEE8F8;--sand:#F0EBDD}
body.th-hc .card,body.th-hc button,body.th-hc input,body.th-hc select,body.th-hc textarea{border:2px solid #000}
body.th-hc nav button,body.th-hc header button{border:0}
.seg{display:flex;flex-wrap:wrap;gap:.4rem}
.seg button{flex:1;min-width:5.5rem;padding:.6rem .4rem;overflow-wrap:anywhere}
.seg button[aria-pressed=true] .sw{border-color:#fff}
.seg button[aria-pressed=true]{background:var(--g);color:#fff;border-color:var(--g);font-weight:700}
.sw{display:inline-block;width:.9em;height:.9em;border-radius:50%;margin-right:.4rem;vertical-align:-.1em;border:1px solid rgba(0,0,0,.25)}
*{box-sizing:border-box}
body{margin:0;background:#EAE3DC;color:var(--ink);font-family:"Atkinson Hyperlegible",Verdana,sans-serif;font-size:var(--fs);line-height:1.5}
#app{max-width:440px;min-height:100vh;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;position:relative}
.i{width:1.15em;height:1.15em;vertical-align:-.2em;flex:none}
header{display:flex;align-items:center;gap:.3rem;padding:.9rem 1rem .3rem;font-size:1.1rem}
header b{flex:0 1 auto;margin-right:auto;cursor:pointer;border-radius:12px;display:flex;align-items:center;gap:.45rem;font-family:"Source Serif 4",Georgia,serif;font-weight:600;font-size:1.3em;color:var(--g)}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--paper);border-radius:16px;padding:.6rem .9rem;min-height:48px;transition:background .15s}
button:hover{background:var(--g2)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #3A78B5;outline-offset:2px}
header button{border-color:transparent;background:transparent;min-width:44px;min-height:44px;padding:.3rem .6rem;font-size:.85em}
header button:hover{background:var(--g2)}
main{flex:1;padding:.6rem 1.1rem 6.5rem;display:flex;flex-direction:column;gap:1rem}
h1,h2,h3{margin:0;font-family:"Source Serif 4",Georgia,serif;font-weight:600;letter-spacing:-.01em;line-height:1.2}
h1{font-size:2em}h2{font-size:1.3em}
.card{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:1.1rem}
.blue{background:var(--b);border-color:transparent}.lav{background:var(--l);border-color:transparent}.sage{background:var(--g2);border-color:transparent}
.mut{color:var(--mut);font-size:.9em}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.big-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6rem;min-height:124px;border-radius:22px;border:1px solid var(--line);font-weight:700;text-align:center}
.big-btn span{display:grid;place-items:center;width:3.2rem;height:3.2rem;border-radius:50%;background:var(--g2);color:var(--g);font-size:1.5rem}
.primary{background:var(--g);color:#fff;border-color:var(--g);font-weight:700;min-height:58px;width:100%}
.primary:hover{opacity:.9}
.row{display:flex;gap:.9rem;align-items:center}
.ic{display:grid;place-items:center;width:3.4rem;height:3.4rem;border-radius:16px;background:var(--g2);color:var(--g);font-size:1.5rem;flex:none}
.grow{flex:1}
.hero{background:var(--g);color:#fff;border:0;padding:1.3rem}
.hero .mut{color:#FFFFFF;opacity:.95;font-weight:500}
.hero h2{font-size:1.5em;color:#fff}
.hero .ic{background:rgba(255,255,255,.2);color:#fff}
.tag{display:inline-block;padding:.1rem .65rem;border-radius:99px;background:var(--sand);color:var(--mut);font-size:.8em}
.tag.now{background:var(--g);color:#fff}.tag.done{background:var(--g2);color:var(--g)}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;display:flex;background:var(--paper);backdrop-filter:blur(8px);border-top:1px solid var(--line)}
nav button{flex:1;border:0;border-radius:0;display:flex;flex-direction:column;align-items:center;gap:.1rem;min-height:62px;background:transparent;color:var(--mut)}
nav button span{font-size:1.45rem;display:grid}
nav button[aria-current=page]{color:var(--g);font-weight:700;box-shadow:inset 0 3px 0 var(--g)}
label{display:block;font-weight:700;margin:.6rem 0 .25rem;font-size:.95em}
input,select,textarea{width:100%;padding:.6rem .8rem;border:1px solid var(--line);border-radius:14px;background:var(--paper);min-height:48px}
.thumb{width:100%;height:170px;object-fit:cover;border-radius:16px}
.ph{height:170px;border-radius:16px;display:grid;place-items:center;font-size:3.4rem;background:var(--g2);color:var(--g)}
.mlist{display:flex;flex-direction:column;gap:.8rem}
.mlist>button:nth-child(3n+2) .ph{background:var(--b);color:var(--g)}
.mlist>button:nth-child(3n+3) .ph{background:var(--l);color:var(--g)}
.mlist b{font-family:"Source Serif 4",Georgia,serif;font-size:1.15em;font-weight:600;padding:.2rem .3rem}
.ov{position:fixed;inset:0;background:rgba(44,37,34,.5);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:1rem;z-index:5}
.ov .card{max-width:400px;width:100%;text-align:center;border:0}
.toast{position:fixed;top:1rem;left:50%;transform:translateX(-50%);background:var(--g);color:#fff;padding:.7rem 1.2rem;border-radius:99px;z-index:9;width:max-content;max-width:92vw}
.del{min-height:40px;padding:.2rem .7rem;font-size:.8em;border-color:var(--line);color:var(--ink);background:transparent}
.stat{font-family:"Source Serif 4",Georgia,serif;font-size:2.4rem;font-weight:600;color:var(--g);line-height:1.1}
.sub{display:flex;gap:.7rem;align-items:center;padding:.55rem .8rem;border-radius:14px;background:var(--sand);color:var(--mut)}
.sub.cur{background:var(--paper);border:1px solid var(--g);box-shadow:inset 4px 0 0 var(--g);color:var(--ink);font-weight:700}
.sub.cur .i,.sub.d .i{color:var(--g)}
.sub.d{text-decoration:line-through}
ol.steps{margin:.6rem 0 0;padding-left:1.5rem;color:var(--mut);font-size:.92em}
ol.steps li{margin:.15rem 0}
.pin{text-align:center;background:var(--sand);border-color:transparent}
.pin-n{font-family:"Source Serif 4",Georgia,serif;font-size:2.2rem;font-weight:600;letter-spacing:.35em;padding-left:.35em;color:var(--g);line-height:1.3}
.logo-img{display:block;width:5rem;height:5rem;margin:0 auto .6rem;border-radius:22px}
.hdr-logo{width:2rem;height:2rem;border-radius:8px;flex:none}
.logo{display:grid;place-items:center;width:4.5rem;height:4.5rem;border-radius:24px;background:var(--g);color:#fff;font-size:2.2rem;margin:0 auto .6rem}
main.welcome{justify-content:flex-start;gap:1.1rem;text-align:center;min-height:100vh;padding:2rem 1.1rem 2rem}
.tagline{font-size:calc(var(--fs)*1.55);font-weight:500;line-height:1.2;margin-top:.2rem}
.lede{margin:0;font-size:calc(var(--fs)*.88);line-height:1.6}
.chev{color:var(--g);display:grid;font-size:1.3rem;flex:none}
.role .chev .i{width:1.3em;height:1.3em;padding:0;background:none;border-radius:0}
.alone{display:flex;align-items:center;gap:.9rem;text-align:left;background:var(--g2);border-radius:22px;padding:1.1rem 1.2rem}
.alone>.i{width:1.7rem;height:1.7rem;color:var(--g);align-self:flex-start;margin-top:.15rem}
.alone h3{font-size:calc(var(--fs)*1.05);margin-bottom:.25rem}
.alone p{margin:0;font-size:calc(var(--fs)*.82);line-height:1.5}
.alone .art{color:var(--g);opacity:.85;flex:none}
.divider{display:flex;align-items:center;gap:.8rem;font-family:"Source Serif 4",Georgia,serif;font-size:calc(var(--fs)*1.05);margin-top:.3rem}
.divider:before,.divider:after{content:"";flex:1;height:1px;background:var(--line)}
.feats{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
.feat{display:flex;flex-direction:column;align-items:center;gap:.4rem}
.feat .c{display:grid;place-items:center;width:3.4rem;height:3.4rem;border-radius:50%;background:var(--g2);color:var(--g);font-size:1.5rem}
.feat b{font-size:calc(var(--fs)*.82)}
.feat .d{font-size:calc(var(--fs)*.7);color:var(--mut);line-height:1.35}
.chk-stamp{margin:.2rem 0 .9rem;font-size:.9em;color:var(--mut)}
.panel{background:var(--paper);border-radius:16px;padding:.2rem 1rem}
.chk-row{display:grid;grid-template-columns:6.2em 1fr;gap:.8rem;align-items:start;padding:.8rem 0;border-top:1px solid var(--line)}
.chk-row:first-child{border-top:0}
.chk-lbl{font-size:.95em;font-weight:700;color:var(--ink);padding-top:.3rem}
.chips{display:flex;flex-direction:column;gap:.1rem;padding-top:.3rem}
.chip{display:inline;padding:0;background:none;color:var(--ink);font-size:1em;font-weight:400;line-height:1.5}
.chk-note{line-height:1.5;padding-top:.3rem}
body.s2 .chk-row{grid-template-columns:1fr;gap:.2rem}
.today>button{width:100%;margin-top:1rem}
.linkbtn{border:0;background:transparent;min-height:44px;font-size:calc(var(--fs)*.85);margin:0 auto;display:flex;gap:.4rem;align-items:center;color:var(--g)}
.role{display:flex;align-items:center;gap:1rem;text-align:left;min-height:88px;border-radius:22px;border:1px solid var(--line);padding:1rem 1.2rem;width:100%;background:var(--paper)}
.role .i{width:2.6em;height:2.6em;padding:.65em;border-radius:14px;background:var(--g2);color:var(--g)}

:root,body.th-terracotta,body.th-forest,body.th-clay{--bg:#F7F5EE;--paper:#F7F5EE;--ink:#344D40;--mut:#344D40;--line:#829782;--g:#344D40;--g2:#E7EBDD;--b:#C5D2C0;--l:#E7EBDD;--sand:#E7EBDD}
body{background:#C5D2C0}
body:not(.th-hc) .hero,body:not(.th-hc) .logo{background:#344D40;color:#F7F5EE}
body:not(.th-hc) .pin{border:1px solid #829782}
body:not(.th-hc) .sw{border-color:#829782}
nav button{min-width:0;overflow-wrap:anywhere;font-size:.65rem;padding:.5rem .1rem}
.role .profile-photo{width:3.25rem;height:3.25rem;object-fit:cover;border-radius:50%;flex:none;display:block;background:var(--g2)}
.contact-photo{width:3.4rem;height:3.4rem;object-fit:cover;border-radius:16px;flex:none;display:block;background:var(--g2)}
.contact-photo.call-photo{width:100px;height:100px;margin:0 auto .8rem;border-radius:50%}
/* Final palette and responsive navigation overrides */
</style>
</head>

const tm=t=>{const[a,b]=t.split(":");return +a*60+ +b};

const durWords=m=>{const h=Math.floor(m/60),r=m%60;return [h?`${h} hour${h>1?"s":""}`:"",r?`${r} minute${r>1?"s":""}`:""].filter(Boolean).join(" ")};

const next=()=>sorted().find(a=>!a.done&&tm(a.t)>=nowMin()-30);

  <button style="width:100%;margin-top:.8rem" data-a="testvoice">🔊 Test voice</button></div>
 <div class="card"><h2>Display</h2>
  <label>Text size</label>${seg("setsize",[[0,"Normal"],[1,"Large"],[2,"Extra large"]],T.size)}
  <label>Color theme</label><div class="seg">${[["forest","Forest & Sage","#344D40"],["hc","High contrast","#FFFFFF"]].map(([v,l,c])=>`<button data-a="theme" data-v="${v}" aria-pressed="${T.theme===v}"><span class="sw" style="background:${c}"></span>${l}</button>`).join("")}</div></div>
 ${isCaregiver?`<button class="primary" data-a="signout">🚪 Sign out</button>`:""}`};
V.patient.settings=()=>settingsView(false);
V.caregiver.settings=()=>settingsView(true);
if("speechSynthesis" in window)speechSynthesis.onvoiceschanged=()=>{if(tab==="settings"&&role)render()};
function applySettings(){document.body.className=`s${S.set.size} th-${S.set.theme}`}
const NAV={patient:[["home","🏠","Home"],["day","📅","My Day"],["people","👪","People"],["mem","🖼️","Memories"],["help","💬","Help"],["settings","⚙️","Settings"]],
 caregiver:[["home","🏠","Home"],["routine","📅","Routine"],["mem","🖼️","Memories"],["notes","📝","Notes"],["people","👪","Contacts"],["settings","⚙️","Settings"]]};

function render(){render0();const a=$("#app");a.innerHTML=iconize(a.innerHTML)}
function render0(){
 const app=$("#app");
 const t=toastMsg?`<div class="toast" role="status">${esc(toastMsg)}</div>`:"";
 if(!role&&askPin){app.innerHTML=`<main class="welcome"><div class="logo">🤍</div><h1>Caregiver sign-in</h1><p class="mut" style="margin:0">Enter the 5-digit PIN shown on ${esc(S.name)}’s home screen.</p>
  <input id="f-pin" inputmode="numeric" pattern="[0-9]*" maxlength="5" autocomplete="off" aria-label="5-digit PIN" placeholder="•••••" style="text-align:center;font-size:1.8em;letter-spacing:.4em">
  ${pinErr?`<p role="alert" style="color:#A95C39;margin:0">That PIN doesn’t match. Please check ${esc(S.name)}’s home screen and try again.</p>`:""}
  <button class="primary" data-a="checkpin">Continue</button><button data-a="backpin">Back</button></main>${t}`;return}
 if(!role&&showSet){app.innerHTML=`<main><div><button class="linkbtn" style="margin:0" data-a="backset">${ico("back")} Back</button></div>${settingsView(false)}</main>${t}`;return}
 if(!role){app.innerHTML=`<main class="welcome"><img class="logo-img" src="${LOGO_DARK}" alt="Cadence logo"><h1>Cadence</h1>
  <h2 class="tagline">A little more connected,<br>every day.</h2>
  <p class="lede">To keep you in sync with the people who care.</p>
  <button class="role" data-a="role" data-v="patient"><img class="profile-photo" src="${esc(PROFILE_IMAGES.margaret)}" alt="Margaret"><span class="grow"><b>${esc(S.name)}</b><br><span class="mut">Patient view</span></span><span class="chev">${ico("chev")}</span></button>
  <button class="role" data-a="askpin"><img class="profile-photo" src="${esc(PROFILE_IMAGES.anna)}" alt="Anna"><span class="grow"><b>${esc(S.cg)}</b><br><span class="mut">Caregiver view</span></span><span class="chev">${ico("chev")}</span></button>
  <div class="alone">${ico("heart")}<div class="grow"><h3>You’re not alone.</h3><p>Cadence is here to help you and your loved ones stay connected, informed, and supported.</p></div>${HANDS}</div>
  <div class="divider"><span>What you can do</span></div>
  <div class="feats">
   <div class="feat"><span class="c">${ico("calcheck")}</span><b>Daily routines</b></div>
   <div class="feat"><span class="c">${ico("users")}</span><b>Stay connected</b></div>
   <div class="feat"><span class="c">${ico("hhand")}</span><b>Caregiver support</b></div></div>
  <button class="linkbtn" data-a="opensettings">${ico("gear")} Accessibility settings</button>
  </main>${t}`;return}
 const view=(V[role][tab]||V[role].home)();
 const navTab=tab==="confused"?"help":tab;
 app.innerHTML=`<header><b data-a="tab" data-v="home" role="link" tabindex="0" aria-label="Cadence, go to home"><img class="hdr-logo" src="${LOGO_LIGHT}" alt="">Cadence</b><button data-a="speak" aria-pressed="${speakOn}">${speakOn?"🔊 On":"🔇 Off"}</button><button data-a="size" aria-label="Change text size">Aa</button><button data-a="role" data-v="">Switch</button></header>
 <main>${view}</main>
 <nav aria-label="Main">${NAV[role].map(([k,i,l])=>`<button data-a="tab" data-v="${k}" ${k===navTab?'aria-current="page"':""}><span>${i}</span>${l}</button>`).join("")}</nav>
 ${ov||""}${t}`;
}

// -------------------- User actions and event handlers --------------------
const A={
 role(v){askPin=false;pinErr=false;showSet=false;role=v||null;tab="home";ov=null;if("speechSynthesis" in window)speechSynthesis.cancel();render()},
 setspeak(v){speakOn=v==="1";S.set.speak=speakOn;if(!speakOn&&"speechSynthesis" in window)speechSynthesis.cancel();save();render()},
 setrate(v){S.set.rate=+v;save();render();say("This is how I will read to you.")},
 testvoice(){say("Hello "+S.name+". This is how I will read to you.",true)},
 setsize(v){S.set.size=+v;applySettings();save();render()},
 theme(v){S.set.theme=v;applySettings();save();render()},
 signout(){A.role("")},
 askpin(){askPin=true;pinErr=false;render();setTimeout(()=>{const f=$("#f-pin");f&&f.focus()},50)},
 checkpin(){if(($("#f-pin").value||"").trim()===S.pin){askPin=false;pinErr=false;role="caregiver";tab="home";render()}else{pinErr=true;render();setTimeout(()=>{const f=$("#f-pin");f&&f.focus()},50)}},
 backpin(){askPin=false;pinErr=false;render()},
 opensettings(){showSet=true;render();scrollTo(0,0)},
 backset(){showSet=false;render();scrollTo(0,0)},
 tab(v){tab=v;ov=null;render();scrollTo(0,0)},
 say(v,b){say(b.dataset.say)},
 speak(){speakOn=!speakOn;S.set.speak=speakOn;save();if(!speakOn&&"speechSynthesis" in window)speechSynthesis.cancel();render()},
 size(){S.set.size=(S.set.size+1)%3;applySettings();save();render()},
 done(v){const a=S.acts.find(x=>x.id==v);a.done=true;save();render();say("Well done.")},
 sub(v){const[id,i]=v.split(":");const a=S.acts.find(x=>x.id==id);a.subs[+i].d=true;const fin=a.subs.every(x=>x.d);if(fin)a.done=true;save();render();say(fin?`You finished ${a.title}. Well done.`:`Well done. Next: ${a.subs.find(x=>!x.d).t}`)},
 shuffle(){shown=pick3(S.mem.length,shown);render();scrollTo(0,0);say("Here are three new memories.")},
 call(v){const p=S.people[v];ov=`<div class="ov"><div class="card">${contactImage(p,true)}<h2>Calling ${esc(p.n)}…</h2><p>${esc(p.r)}${p.phone?`<br><b>${esc(p.phone)}</b>`:""}</p><p class="mut">(Demo screen. Real calling is a future feature.)</p><button class="primary" data-a="closeov">End call</button></div></div>`;render();say(`Calling ${p.n}`)},
 talk(v){const p=S.people[v];S.notes.unshift({by:S.name,tx:`${S.name} sent “I would like to talk” to ${p.n}.`,ts:"Just now"});save();toast(`Message sent to ${p.n}`)},
 mem(v){const m=S.mem[v];ov=`<div class="ov"><div class="card">${m.img?`<img class="thumb" style="height:220px" alt="" src="${m.img}">`:`<div class="ph" style="height:200px;font-size:6rem">${m.ic||"📷"}</div>`}<h2 style="margin-top:.6rem">${esc(m.title)}</h2><p>${esc(m.cap)}</p><button class="primary" data-a="closeov">Close</button></div></div>`;render();say(`${m.title}. ${m.cap}`)},
 closeov(){ov=null;if("speechSynthesis" in window)speechSynthesis.cancel();render()},
 editAct(v){const a=S.acts.find(x=>x.id==v);draft={id:a.id,title:a.title,t:a.t,durH:String(Math.floor((a.dur||0)/60)),dur:String((a.dur||0)%60),msg:a.msg,ic:a.ic,subs:(a.subs||[]).map(x=>x.t).join("\n")};render();const f=document.getElementById("actform");if(f)f.scrollIntoView({behavior:"smooth"})},
 cancelEdit(){draft=newDraft();render()},
 previewAct(){const a=draftAct();if(!a)return;ov=`<div class="ov"><div class="card" style="text-align:left;max-height:90vh;overflow:auto"><span class="mut">Preview: how ${esc(S.name)} will see it</span>
  <div class="row" style="margin:.7rem 0"><div class="ic">${a.ic}</div><div><h2>${fmt(a.t)} · ${esc(a.title)}</h2><div>${esc(a.msg)}</div>${a.dur?`<span class="tag">${fmtDur(a.dur)}</span>`:""}</div></div>
  ${a.subs.length?`<div style="display:flex;flex-direction:column;gap:.4rem">${a.subs.map((x,i)=>`<div class="sub ${i===0?"cur":""}"><span>${i===0?"👉":"⚪"}</span><span class="grow">${esc(x.t)}</span></div>`).join("")}</div>`:""}
  <button class="primary" style="margin-top:.9rem" data-a="sendAct">Send to patient</button><button style="width:100%;margin-top:.5rem" data-a="closeov">Close preview</button></div></div>`;render()},
 sendAct(){const a=draftAct();if(!a)return;const i=S.acts.findIndex(x=>x.id===a.id);if(i>=0)S.acts[i]=a;else S.acts.push(a);draft=newDraft();ov=null;save();toast(`Sent. It now shows on ${S.name}’s day.`)},
 delAct(v){S.acts=S.acts.filter(a=>a.id!=v);if(draft.id==v)draft=newDraft();save();render()},
 addMem(){const t=$("#f-mt").value.trim();if(!t)return toast("Please add a name or event.");
  S.mem.push({title:t,cap:$("#f-mc").value.trim()||t,ic:"📷",img:pend});pend=null;save();toast("Memory saved.")},
 delMem(v){S.mem.splice(v,1);save();render()},
 addNote(){const t=$("#f-note").value.trim();if(!t)return;S.notes.unshift({by:S.cg,tx:t,ts:"Just now"});save();toast("Note added.")},
 addPerson(){const n=$("#f-pn").value.trim();if(!n)return toast("Please add a name.");S.people.push({n,r:$("#f-pr").value.trim()||"Family",ic:"🙂",note:"Saved contact",phone:$("#f-pp").value.trim(),img:contactPhoto});contactPhoto=null;save();toast("Contact added.")},
 delPerson(v){S.people.splice(v,1);save();render()},
};
document.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){const h=e.target.closest("header b[data-a]");if(h){e.preventDefault();A[h.dataset.a](h.dataset.v,h)}}});
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(b&&A[b.dataset.a])A[b.dataset.a](b.dataset.v,b)});
document.addEventListener("input",e=>{const k={"f-title":"title","f-time":"t","f-dur":"dur","f-durh":"durH","f-msg":"msg","f-subs":"subs","f-ic":"ic"}[e.target.id];if(k)draft[k]=e.target.value});
document.addEventListener("change",e=>{if(e.target.id==="s-voice"){S.set.voice=e.target.value;save()}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="f-pin")A.checkpin()});
document.addEventListener("change",e=>{if(e.target.id!=="f-img")return;const f=e.target.files[0];if(!f)return;
 const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,360/im.width),c=document.createElement("canvas");
 c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);pend=c.toDataURL("image/jpeg",.7);$("#imgok").textContent="Photo added ✓"};im.src=r.result};r.readAsDataURL(f)});

S.set.theme=S.set.theme==='hc'?'hc':'forest';
S.todos=S.todos||[];S.checkins=S.checkins||[];
// -------------------- Daily wellbeing check-ins and caregiver tasks --------------------
const localDay=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const dateLabel=d=>new Date(d+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
const longDate=d=>new Date(d+'T12:00:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric'});
const timeOf=iso=>new Date(iso).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
const checkBody=c=>`<div class="chk-rows">
 <div class="chk-row"><span class="chk-lbl">Mood</span><div class="chips"><span class="chip">${esc(c.mood)}</span></div></div>
 <div class="chk-row"><span class="chk-lbl">Symptoms</span><div class="chips">${c.symptoms.length?c.symptoms.map(x=>`<span class="chip">${esc(x)}</span>`).join(''):'<span class="chip soft">None reported</span>'}</div></div>
 ${c.symptoms.length?`<div class="chk-row"><span class="chk-lbl">Severity</span><div class="chips"><span class="chip">${esc(c.severity)}</span></div></div>`:''}
 ${c.note?`<div class="chk-row"><span class="chk-lbl">Note</span><div class="chk-note">“${esc(c.note)}”</div></div>`:''}</div>`;
const stampOf=c=>c.updated?`Saved at ${timeOf(c.updated)}`:'Time not recorded';
const cardCheck=c=>`<div class="card"><h2>${longDate(c.date)}</h2><p class="chk-stamp">${stampOf(c)} · Patient-reported</p>${checkBody(c)}</div>`;
const todayCheck=()=>S.checkins.find(c=>c.date===localDay());
const oldPatientHome=V.patient.home;
V.patient.home=()=>oldPatientHome().replace('My Memories</button></div>','My Memories</button><button class="big-btn" style="grid-column:1/-1" data-a="tab" data-v="wellbeing"><span>🤍</span>Symptoms &amp; Mood</button></div>');
const oldCareHome=V.caregiver.home;
V.caregiver.home=()=>oldCareHome().replace('<h2>Quick actions</h2>',`<div class="card blue today"><h2>Today’s Symptoms &amp; Mood</h2>${todayCheck()?`<p class="chk-stamp">${longDate(todayCheck().date)} · ${stampOf(todayCheck())}</p><div class="panel">${checkBody(todayCheck())}</div>`:'<p class="chk-stamp">No check-in saved today.</p>'}<button data-a="tab" data-v="wellbeing">View check-in history</button></div><h2>Quick actions</h2>`).replace('Care notes','Caregiver Reminders &amp; To-Dos').replace('Record observations for the care team.','Manage tasks and follow-ups.');
V.caregiver.notes=()=>`<h1>Caregiver Reminders &amp; To-Dos</h1><p class="mut">Your own tasks and follow-ups, separate from the patient’s routine.</p><div class="card sage"><label for="todo-title">Task</label><input id="todo-title" placeholder="Schedule an appointment"><label for="todo-due">Due date (optional)</label><input id="todo-due" type="date"><label for="todo-detail">Details (optional)</label><textarea id="todo-detail"></textarea><button class="primary" style="margin-top:1rem" data-a="addTodo">Add to-do</button></div><h2>Tasks</h2>${S.todos.length?[...S.todos].sort((a,b)=>Number(a.done)-Number(b.done)).map(t=>`<div class="card"><b style="${t.done?'text-decoration:line-through':''}">${esc(t.title)}</b><p class="mut">${t.done?'Completed':t.due&&t.due<localDay()?'Overdue':'Open'}${t.due?' · Due '+dateLabel(t.due):''}</p><p>${esc(t.detail)}</p><div class="row"><button data-a="toggleTodo" data-v="${t.id}">${t.done?'Reopen':'Done'}</button><button data-a="removeTodo" data-v="${t.id}">Remove</button></div></div>`).join(''):'<p class="mut">No tasks yet.</p>'}`;
let wellnessDraft=null;
V.patient.wellbeing=()=>{const d=wellnessDraft||(todayCheck()?JSON.parse(JSON.stringify(todayCheck())):{mood:'',symptoms:[],severity:'Mild',note:''});wellnessDraft=d;return `<h1>Symptoms &amp; Mood</h1><p class="mut">How are you feeling today? Saved check-ins are visible to ${esc(S.cg)} in this app.</p><div class="card sage"><h2>${longDate(localDay())}</h2>${todayCheck()&&todayCheck().updated?`<p class="mut" style="margin:.1rem 0 0">Last saved at ${timeOf(todayCheck().updated)}</p>`:''}<label>How is your mood?</label><div class="seg" role="group" aria-label="Mood">${['Happy','Good','Okay','Tired','Sad','Anxious'].map(m=>`<button data-a="pickMood" data-v="${m}" aria-pressed="${d.mood===m}">${m}</button>`).join('')}</div><label>Symptoms — choose all that apply</label><div class="seg" role="group" aria-label="Symptoms"><button data-a="noSymptoms" aria-pressed="${!d.symptoms.length}">No symptoms</button>${['Pain','Headache','Dizziness','Tiredness','Nausea','Trouble sleeping','Confusion','Other'].map(m=>`<button data-a="pickSymptom" data-v="${m}" aria-pressed="${d.symptoms.includes(m)}">${m}</button>`).join('')}</div>${d.symptoms.length?`<label for="well-severity">Overall severity</label><select id="well-severity">${['Mild','Moderate','Severe'].map(x=>`<option ${d.severity===x?'selected':''}>${x}</option>`).join('')}</select>`:''}<label for="well-note">Anything else? (optional)</label><textarea id="well-note" rows="3" maxlength="1500">${esc(d.note)}</textarea><button class="primary" style="margin-top:1rem" data-a="saveCheckin">${todayCheck()?'Update':'Save'} today’s check-in</button><p class="mut">This app is not monitored for emergencies.</p></div><h2>Recent check-ins</h2>${[...S.checkins].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,7).map(cardCheck).join('')||'<p>No check-ins yet.</p>'}`};
V.caregiver.wellbeing=()=>`<h1>Patient Symptoms &amp; Mood</h1><p class="mut">${esc(S.name)}’s self-reported check-ins. Not a diagnosis or emergency monitoring service.</p>${[...S.checkins].sort((a,b)=>b.date.localeCompare(a.date)).map(cardCheck).join('')||'<div class="card">No check-ins yet.</div>'}`;
NAV.patient.splice(4,0,['wellbeing','🤍','Check-in']);
NAV.caregiver.find(x=>x[0]==='notes')[2]='To-Dos';
NAV.caregiver.splice(4,0,['wellbeing','🤍','Check-ins']);
Object.assign(A,{
addTodo(){const title=$('#todo-title').value.trim();if(!title)return toast('Please enter a task.');S.todos.unshift({id:Date.now(),title,due:$('#todo-due').value,detail:$('#todo-detail').value.trim(),done:false});save();toast('To-do added.')},
toggleTodo(v){const t=S.todos.find(t=>t.id==v);if(t)t.done=!t.done;save();render()},
removeTodo(v){S.todos=S.todos.filter(t=>t.id!=v);save();render()},
pickMood(v){wellnessDraft.mood=v;render()},
pickSymptom(v){const d=wellnessDraft;d.symptoms=d.symptoms.includes(v)?d.symptoms.filter(x=>x!==v):[...d.symptoms,v];render()},
noSymptoms(){wellnessDraft.symptoms=[];render()},
saveCheckin(){if(!wellnessDraft.mood)return toast('Please choose your mood.');const c={...wellnessDraft,symptoms:[...wellnessDraft.symptoms],date:localDay(),updated:new Date().toISOString()};S.checkins=S.checkins.filter(x=>x.date!==c.date);S.checkins.push(c);save();wellnessDraft=null;toast('Check-in saved and visible to your caregiver.')}
});
const oldTab=A.tab;A.tab=v=>{if(v==='wellbeing')wellnessDraft=null;oldTab(v)};
document.addEventListener('input',e=>{if(e.target.id==='well-note'&&wellnessDraft)wellnessDraft.note=e.target.value});
document.addEventListener('change',e=>{if(e.target.id==='well-severity'&&wellnessDraft)wellnessDraft.severity=e.target.value});

document.addEventListener('change',e=>{
 if(e.target.id!=='f-person-photo')return;
 const file=e.target.files[0],status=document.getElementById('person-photo-status'),button=document.querySelector('[data-a="addPerson"]');
 if(!file)return;
 const fail=()=>{button.disabled=false;status.textContent='Could not read that image. Please choose another photo.';e.target.value=''};
 if(!file.type.startsWith('image/')){fail();return}
 button.disabled=true;status.textContent='Preparing photo…';
 const reader=new FileReader();reader.onerror=fail;
 reader.onload=()=>{const image=new Image();image.onerror=fail;image.onload=()=>{
 try{const scale=Math.min(1,480/Math.max(image.width,image.height)),canvas=document.createElement('canvas');
 canvas.width=Math.max(1,Math.round(image.width*scale));canvas.height=Math.max(1,Math.round(image.height*scale));
 canvas.getContext('2d').drawImage(image,0,0,canvas.width,canvas.height);contactPhoto=canvas.toDataURL('image/jpeg',.85);
 status.textContent='Photo ready. Save the contact to keep it.';button.disabled=false;
 }catch(err){fail()}};image.src=reader.result};reader.readAsDataURL(file);
});

// Apply saved preferences and display the initial screen.
applySettings();
render();
</script>
</body>
</html>
